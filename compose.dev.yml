services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cellen
      POSTGRES_USER: cellen
      POSTGRES_PASSWORD: cellen-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellen"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cellen:cellen-dev-only@db:5432/cellen
      SECRET_KEY: development-only-change-me
      PLATFORM_ADMIN_EMAIL: admin@example.test
      PLATFORM_ADMIN_PASSWORD: development-only
      FINREG_INTEGRATION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
