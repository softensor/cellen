name: Flutter Build

on:
  push:
    branches: [main, master, finance-improve]
    paths:
      - 'mobile/**'
      - '.github/finreg-packages-ref'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/finreg-packages-ref'
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Android APK + AAB
  # ─────────────────────────────────────────────
  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Finreg revision
        id: finreg-ref
        run: echo "ref=$(cat .github/finreg-packages-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Finreg packages
        uses: actions/checkout@v4
        with:
          repository: softensor/finreg
          ref: ${{ steps.finreg-ref.outputs.ref }}
          token: ${{ secrets.FINREG_READ_TOKEN }}
          path: finreg-source

      - name: Expose Finreg sibling packages
        run: ln -s "$GITHUB_WORKSPACE/finreg-source" "$GITHUB_WORKSPACE/../finreg"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Create Android platform files
        working-directory: mobile
        run: flutter create . --project-name cellen --org com.cellen --platforms android

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: mobile
        run: flutter build apk --debug

      - name: Build AAB (release)
        working-directory: mobile
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────
  # iOS IPA
  # ─────────────────────────────────────────────
  build-ios:
    name: iOS
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Finreg revision
        id: finreg-ref
        run: echo "ref=$(cat .github/finreg-packages-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Finreg packages
        uses: actions/checkout@v4
        with:
          repository: softensor/finreg
          ref: ${{ steps.finreg-ref.outputs.ref }}
          token: ${{ secrets.FINREG_READ_TOKEN }}
          path: finreg-source

      - name: Expose Finreg sibling packages
        run: ln -s "$GITHUB_WORKSPACE/finreg-source" "$GITHUB_WORKSPACE/../finreg"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Create iOS platform files
        working-directory: mobile
        run: flutter create . --project-name cellen --org com.cellen --platforms ios

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile/build/ios/iphoneos/Runner.app

  # ─────────────────────────────────────────────
  # Web — build + deploy to GitHub Pages
  # ─────────────────────────────────────────────
  build-web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Finreg revision
        id: finreg-ref
        run: echo "ref=$(cat .github/finreg-packages-ref)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Finreg packages
        uses: actions/checkout@v4
        with:
          repository: softensor/finreg
          ref: ${{ steps.finreg-ref.outputs.ref }}
          token: ${{ secrets.FINREG_READ_TOKEN }}
          path: finreg-source

      - name: Expose Finreg sibling packages
        run: ln -s "$GITHUB_WORKSPACE/finreg-source" "$GITHUB_WORKSPACE/../finreg"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Create web platform files
        working-directory: mobile
        run: flutter create . --project-name cellen --org com.cellen --platforms web

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build web
        working-directory: mobile
        # base-href must match the repo path on GitHub Pages: /<repo-name>/
        run: |
          flutter build web --release \
            --base-href /${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web/

  deploy-web:
    name: Deploy Web
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
